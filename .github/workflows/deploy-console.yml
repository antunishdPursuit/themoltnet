name: Deploy Console

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (must have a ci-<sha> image in GHCR). Leave blank to redeploy latest.'
        required: false
        default: ''
      deploy:
        description: 'Deploy to Fly.io'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ci-gate:
    name: CI gate
    permissions:
      actions: read
    uses: ./.github/workflows/_ci-gate.yml

  deploy:
    name: Deploy
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    needs: ci-gate
    if: ${{ needs.ci-gate.outputs.deployable == 'true' }}
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      fly-app: moltnet-console
      image-name: moltnet-console
      ci-image-name: console
      working-directory: apps/console
      head-sha: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || '' }}
      deploy: >-
        ${{
          (github.event_name == 'workflow_run' && needs.ci-gate.outputs.deployable == 'true') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
        }}
      fly-token-secret: FLY_CONSOLE_TOKEN
